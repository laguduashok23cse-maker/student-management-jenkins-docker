<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<nav class="navbar navbar-dark"><div class="container"><span class="navbar-brand">Student Management System</span></div></nav>
<main class="container py-5">
  <div class="mb-4"><h1>Student Dashboard</h1><p class="text-muted">Add, edit and manage student records.</p></div>
  <div class="row g-4">
    <section class="col-lg-4">
      <div class="card shadow-sm"><div class="card-body">
        <h5 class="card-title mb-3" th:text="${student.id == null ? 'Add Student' : 'Edit Student'}">Add Student</h5>
        <form th:action="@{/students}" th:object="${student}" method="post">
          <input type="hidden" th:field="*{id}">
          <label class="form-label">Full name</label><input class="form-control mb-3" th:field="*{name}" required placeholder="e.g. Rahul Kumar">
          <label class="form-label">Email</label><input type="email" class="form-control mb-3" th:field="*{email}" required placeholder="rahul@example.com">
          <label class="form-label">Course</label><input class="form-control mb-3" th:field="*{course}" required placeholder="e.g. Computer Science">
          <button class="btn btn-primary w-100" type="submit">Save Student</button>
          <a th:if="${student.id != null}" href="/" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
        </form>
      </div></div>
    </section>
    <section class="col-lg-8">
      <div class="card shadow-sm"><div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3"><h5 class="mb-0">Student Records</h5><span class="badge text-bg-primary" th:text="${students.size()} + ' students'">0 students</span></div>
        <div class="table-responsive"><table class="table table-hover align-middle">
          <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Course</th><th>Actions</th></tr></thead>
          <tbody><tr th:each="s : ${students}">
            <td th:text="${s.id}"></td><td th:text="${s.name}"></td><td th:text="${s.email}"></td><td th:text="${s.course}"></td>
            <td class="text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/students/edit/{id}(id=${s.id})}">Edit</a>
            <a class="btn btn-sm btn-outline-danger" th:href="@{/students/delete/{id}(id=${s.id})}" onclick="return confirm('Delete this student?')">Delete</a></td>
          </tr><tr th:if="${students.isEmpty()}"><td colspan="5" class="text-center text-muted py-4">No students yet. Add your first student.</td></tr></tbody>
        </table></div>
      </div></div>
    </section>
  </div>
</main>
</body></html>
